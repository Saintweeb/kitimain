<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KITI ICT Department</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0d14;--bg2:#0f1320;--bg3:#141827;--bg4:#1a2035;
  --accent:#00f5d4;--accent2:#7c3aed;--accent3:#f59e0b;
  --green:#10b981;--red:#ef4444;--blue:#3b82f6;
  --text:#e8eaf0;--muted:#6b7280;--border:#1e2640;
  --card:#111827;--font:'DM Sans',sans-serif;
  --mono:'Space Mono',monospace;--display:'Orbitron',sans-serif;
}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh}
/* ── Login ── */
#loginPage{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);position:relative;overflow:hidden}
.login-grid{position:absolute;inset:0;background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);background-size:50px 50px;opacity:.4}
.login-glow{position:absolute;width:600px;height:600px;background:radial-gradient(circle,#7c3aed22 0%,transparent 70%);top:-100px;right:-100px}
.login-glow2{position:absolute;width:400px;height:400px;background:radial-gradient(circle,#00f5d422 0%,transparent 70%);bottom:-100px;left:-100px}
.login-wrap{position:relative;z-index:10;width:100%;max-width:480px;padding:20px}
.kiti-logo{text-align:center;margin-bottom:40px}
.kiti-logo h1{font-family:var(--display);font-size:28px;font-weight:900;color:var(--accent);letter-spacing:3px;text-shadow:0 0 30px #00f5d466}
.kiti-logo p{color:var(--muted);font-size:13px;letter-spacing:2px;margin-top:6px;text-transform:uppercase}
.login-card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:36px}
.login-card h2{font-size:22px;font-weight:700;margin-bottom:6px}
.login-card p{color:var(--muted);font-size:13px;margin-bottom:28px}
.role-select{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:24px}
.role-btn{border:1.5px solid var(--border);background:var(--bg2);border-radius:12px;padding:18px 12px;cursor:pointer;text-align:center;transition:all .25s}
.role-btn:hover{border-color:var(--accent);transform:translateY(-2px)}
.role-btn.selected{border-color:var(--accent);background:#00f5d410;box-shadow:0 0 20px #00f5d420}
.role-btn .ri{font-size:32px;margin-bottom:8px}
.role-btn span{display:block;font-weight:600;font-size:14px}
.role-btn small{color:var(--muted);font-size:11px}
.form-group{margin-bottom:16px}
.form-label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.form-input,.form-control{width:100%;background:var(--bg2);border:1.5px solid var(--border);border-radius:10px;padding:12px 14px;font-size:14px;color:var(--text);font-family:var(--font);outline:none;transition:border .2s}
.form-input:focus,.form-control:focus{border-color:var(--accent)}
.form-input::placeholder,.form-control::placeholder{color:#374151}
textarea.form-control{resize:vertical;min-height:90px}
select.form-control{cursor:pointer}
.btn-login{width:100%;padding:14px;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;font-family:var(--font);letter-spacing:.5px;transition:all .25s;background:linear-gradient(135deg,var(--accent2),var(--accent));color:#fff;box-shadow:0 4px 20px #7c3aed44}
.btn-login:hover{transform:translateY(-2px);box-shadow:0 8px 30px #7c3aed66}
.btn-login:disabled{opacity:.6;cursor:not-allowed;transform:none}
.login-links{display:flex;justify-content:space-between;margin-top:14px;font-size:12px}
.login-links a{color:var(--accent);cursor:pointer;text-decoration:none}
.login-links a:hover{text-decoration:underline}
.alert-box{border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:14px;display:none}
.alert-error{background:#ef444422;border:1px solid var(--red);color:#fca5a5}
.alert-success{background:#10b98122;border:1px solid var(--green);color:#6ee7b7}
/* ── App Shell ── */
#appShell{display:none;min-height:100vh;flex-direction:column}
.topnav{background:var(--card);border-bottom:1px solid var(--border);padding:0 24px;height:60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200}
.topnav-logo{font-family:var(--display);font-size:15px;font-weight:900;color:var(--accent);letter-spacing:2px}
.topnav-logo span{color:var(--muted);font-weight:400;font-size:12px;margin-left:8px;font-family:var(--font)}
.topnav-tabs{display:flex;gap:2px;overflow-x:auto}
.tnav{padding:8px 14px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:500;color:var(--muted);transition:all .2s;display:flex;align-items:center;gap:6px;white-space:nowrap}
.tnav:hover{color:var(--text);background:var(--bg3)}
.tnav.active{color:var(--accent);background:#00f5d412}
.topnav-right{display:flex;align-items:center;gap:12px;flex-shrink:0}
.notif-btn{width:36px;height:36px;border-radius:8px;background:var(--bg3);border:1px solid var(--border);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;position:relative}
.notif-badge{position:absolute;top:4px;right:4px;width:16px;height:16px;border-radius:50%;background:var(--red);font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;color:#fff;border:1.5px solid var(--card)}
.avatar-btn{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--accent2),var(--accent));display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;cursor:pointer;border:2px solid var(--accent)}
.content-area{flex:1;padding:28px;max-width:1400px;width:100%;margin:0 auto}
/* ── Loading ── */
.loading-spinner{display:flex;align-items:center;justify-content:center;padding:60px;color:var(--muted);gap:12px;font-size:14px}
.spinner{width:24px;height:24px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* ── Cards ── */
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:22px}
.card-title{font-size:14px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;gap:8px}
/* ── Grid ── */
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.g2{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
.g2-3{display:grid;grid-template-columns:1fr 1.5fr;gap:20px}
/* ── Stats ── */
.stat{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px}
.stat-icon{font-size:24px;margin-bottom:10px}
.stat-val{font-size:30px;font-weight:700;line-height:1}
.stat-label{font-size:12px;color:var(--muted);margin-top:4px;font-weight:500}
/* ── Badge ── */
.badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:700;gap:4px}
.b-green{background:#10b98122;color:#34d399}.b-red{background:#ef444422;color:#f87171}
.b-blue{background:#3b82f622;color:#60a5fa}.b-amber{background:#f59e0b22;color:#fbbf24}
.b-purple{background:#7c3aed22;color:#a78bfa}.b-cyan{background:#00f5d422;color:#00f5d4}
.b-gray{background:#37415122;color:#9ca3af}
.live-pill{display:inline-flex;align-items:center;gap:5px;background:#ef444422;color:#f87171;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:700}
.live-dot{width:6px;height:6px;border-radius:50%;background:#ef4444;animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
/* ── Buttons ── */
.btn{padding:9px 18px;border-radius:9px;border:none;cursor:pointer;font-size:13px;font-weight:600;font-family:var(--font);transition:all .2s;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn-primary{background:var(--accent2);color:#fff}.btn-primary:hover{background:#6d28d9}
.btn-accent{background:var(--accent);color:#0a0d14}.btn-accent:hover{filter:brightness(1.1)}
.btn-outline{background:transparent;color:var(--text);border:1px solid var(--border)}.btn-outline:hover{background:var(--bg3)}
.btn-danger{background:var(--red);color:#fff}.btn-sm{padding:5px 12px;font-size:12px}
.btn-xs{padding:4px 9px;font-size:11px}
.btn-success{background:var(--green);color:#fff}
/* ── Table ── */
.table-wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--border)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--bg3);padding:11px 14px;text-align:left;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border)}
td{padding:11px 14px;border-bottom:1px solid #1a2035;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--bg3)}
/* ── Progress ── */
.progress{background:var(--bg3);border-radius:99px;height:6px;overflow:hidden}
.progress-bar{height:100%;border-radius:99px;transition:width .4s}
/* ── Avatar ── */
.av{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0}
.av-sm{width:32px;height:32px;font-size:12px}.av-md{width:42px;height:42px;font-size:15px}
.av-lg{width:60px;height:60px;font-size:20px}
/* ── Modal ── */
.overlay{position:fixed;inset:0;background:#00000099;display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px;backdrop-filter:blur(4px)}
.modal{background:var(--card);border:1px solid var(--border);border-radius:20px;width:100%;max-width:540px;max-height:90vh;overflow-y:auto}
.modal-lg{max-width:720px}
.modal-header{padding:22px 24px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--card);z-index:1;border-radius:20px 20px 0 0}
.modal-title{font-size:17px;font-weight:700}
.modal-close{background:none;border:none;font-size:20px;cursor:pointer;color:var(--muted);padding:4px;line-height:1;border-radius:6px}
.modal-close:hover{color:var(--text);background:var(--bg3)}
.modal-body{padding:24px}
/* ── Form ── */
.form-group{margin-bottom:14px}
.form-label{display:block;font-size:11px;font-weight:700;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
/* ── Misc ── */
.empty{text-align:center;padding:48px;color:var(--muted)}
.empty-icon{font-size:48px;margin-bottom:12px}
.module-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;transition:all .25s;cursor:pointer}
.module-card:hover{border-color:var(--accent);transform:translateY(-3px);box-shadow:0 8px 30px #00f5d415}
.assign-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:12px}
.rev-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;display:flex;align-items:center;gap:14px;transition:all .2s;cursor:pointer}
.rev-card:hover{border-color:var(--accent2)}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:#374151;border-radius:99px}
</style>
</head>
<body>

<!-- ═══ LOGIN ═══ -->
<div id="loginPage">
  <div class="login-grid"></div>
  <div class="login-glow"></div>
  <div class="login-glow2"></div>
  <div class="login-wrap">
    <div class="kiti-logo">
      <h1>KITI</h1>
      <p>ICT Department Portal</p>
    </div>
    <div class="login-card">
      <h2>Welcome Back</h2>
      <p>Sign in to your portal</p>
      <div class="role-select">
        <div class="role-btn selected" id="roleStudent" onclick="selectRole('student')">
          <div class="ri">🎓</div><span>Student</span><small>Access your portal</small>
        </div>
        <div class="role-btn" id="roleLecturer" onclick="selectRole('lecturer')">
          <div class="ri">👨‍🏫</div><span>Lecturer</span><small>Manage your classes</small>
        </div>
      </div>
      <div id="loginAlert" class="alert-box alert-error"></div>
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input class="form-input" id="loginEmail" type="email" placeholder="alice@kiti.ac.ke" value="alice@kiti.ac.ke">
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input class="form-input" id="loginPassword" type="password" placeholder="Your password" value="student1234">
      </div>
      <button class="btn-login" id="loginBtn" onclick="doLogin()">Sign In →</button>
      <div class="login-links">
        <a onclick="showForgotPassword()">Forgot password?</a>
        <a onclick="fillDemo()">Use demo account</a>
      </div>
    </div>
  </div>
</div>

<!-- ═══ APP ═══ -->
<div id="appShell" style="display:none;flex-direction:column">
  <nav class="topnav">
    <div class="topnav-logo">KITI <span id="roleLabel">Portal</span></div>
    <div class="topnav-tabs" id="topnavTabs"></div>
    <div class="topnav-right">
      <div class="notif-btn" onclick="loadNotifications()" id="notifBtn">🔔<div class="notif-badge" id="notifBadge" style="display:none">0</div></div>
      <div class="avatar-btn" id="topAvatar" onclick="switchSection('profile')">?</div>
      <button class="btn btn-outline btn-sm" onclick="doLogout()">Sign Out</button>
    </div>
  </nav>
  <div class="content-area" id="contentArea">
    <div class="loading-spinner"><div class="spinner"></div>Loading...</div>
  </div>
</div>

<div id="modalRoot"></div>

<script>
// ═══════════════════════════════════════════════════════════
// CONFIG – change API_BASE to your Django server URL
// ═══════════════════════════════════════════════════════════
const API_BASE = 'http://127.0.0.1:8000/api';

// ═══════════════════════════════════════════════════════════
// TOKEN MANAGEMENT
// ═══════════════════════════════════════════════════════════
const Auth = {
  getAccess()  { return localStorage.getItem('kiti_access') },
  getRefresh() { return localStorage.getItem('kiti_refresh') },
  getUser()    { try { return JSON.parse(localStorage.getItem('kiti_user') || 'null') } catch { return null } },
  setTokens(access, refresh, user) {
    localStorage.setItem('kiti_access',  access);
    localStorage.setItem('kiti_refresh', refresh);
    localStorage.setItem('kiti_user',    JSON.stringify(user));
  },
  clear() {
    localStorage.removeItem('kiti_access');
    localStorage.removeItem('kiti_refresh');
    localStorage.removeItem('kiti_user');
  },
  isLoggedIn() { return !!this.getAccess() },
};

// ═══════════════════════════════════════════════════════════
// API HELPER
// ═══════════════════════════════════════════════════════════
async function api(path, options = {}) {
  const headers = { 'Content-Type': 'application/json', ...(options.headers || {}) };
  if (Auth.getAccess()) headers['Authorization'] = `Bearer ${Auth.getAccess()}`;

  // Don't set Content-Type for FormData (browser sets multipart boundary)
  if (options.body instanceof FormData) delete headers['Content-Type'];

  let res = await fetch(`${API_BASE}${path}`, { ...options, headers });

  // Token expired → try refresh
  if (res.status === 401 && Auth.getRefresh()) {
    const refreshRes = await fetch(`${API_BASE}/auth/refresh/`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ refresh: Auth.getRefresh() }),
    });
    if (refreshRes.ok) {
      const data = await refreshRes.json();
      localStorage.setItem('kiti_access', data.access);
      headers['Authorization'] = `Bearer ${data.access}`;
      res = await fetch(`${API_BASE}${path}`, { ...options, headers });
    } else {
      Auth.clear();
      showLogin();
      throw new Error('Session expired. Please log in again.');
    }
  }
  return res;
}

async function apiJSON(path, options = {}) {
  const res = await api(path, options);
  if (!res.ok) {
    const err = await res.json().catch(() => ({ detail: `HTTP ${res.status}` }));
    throw new Error(err.detail || JSON.stringify(err));
  }
  return res.json();
}

// ═══════════════════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════════════════
const COLORS_BG  = ['#7c3aed','#0891b2','#059669','#d97706','#dc2626','#9333ea'];
const COLORS_TXT = ['#ddd6fe','#a5f3fc','#a7f3d0','#fde68a','#fecaca','#e9d5ff'];
function initials(n) { return (n||'?').split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase() }
function avStyle(name) { const i=(name||'').charCodeAt(0)%6; return `background:${COLORS_BG[i]};color:${COLORS_TXT[i]}` }
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') }
function fmtDate(d) { if(!d) return ''; return new Date(d).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}) }
function gradeColor(p) { return p>=70?'var(--green)':p>=50?'var(--accent3)':'var(--red)' }
function gradeLetter(p) { if(p>=80)return'A';if(p>=65)return'B';if(p>=50)return'C';if(p>=40)return'D';return'F' }
function loading() { return `<div class="loading-spinner"><div class="spinner"></div>Loading...</div>` }
function errBox(msg) { return `<div style="text-align:center;padding:40px;color:var(--red)">⚠️ ${esc(msg)}</div>` }

let currentRole = 'student';
let currentSection = 'dashboard';

// ═══════════════════════════════════════════════════════════
// LOGIN / LOGOUT
// ═══════════════════════════════════════════════════════════
function selectRole(r) {
  currentRole = r;
  document.getElementById('roleStudent').classList.toggle('selected', r==='student');
  document.getElementById('roleLecturer').classList.toggle('selected', r==='lecturer');
  if (r === 'student') { document.getElementById('loginEmail').value = 'alice@kiti.ac.ke'; document.getElementById('loginPassword').value = 'student1234'; }
  else { document.getElementById('loginEmail').value = 'omondi@kiti.ac.ke'; document.getElementById('loginPassword').value = 'lecturer1234'; }
}
function fillDemo() { selectRole(currentRole); }

async function doLogin() {
  const email    = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const btn      = document.getElementById('loginBtn');
  const alert    = document.getElementById('loginAlert');
  if (!email || !password) { showAlert(alert, 'Please enter email and password.'); return; }
  btn.disabled = true; btn.textContent = 'Signing in...';
  alert.style.display = 'none';
  try {
    const data = await apiJSON('/auth/login/', {
      method: 'POST',
      body: JSON.stringify({ email, password }),
    });
    Auth.setTokens(data.access, data.refresh, data.user);
    currentRole = data.user.role;
    bootApp(data.user);
  } catch(e) {
    showAlert(alert, e.message || 'Login failed. Check your credentials.');
  } finally {
    btn.disabled = false; btn.textContent = 'Sign In →';
  }
}
function showAlert(el, msg) { el.textContent = msg; el.style.display = 'block'; }

async function doLogout() {
  try {
    await api('/auth/logout/', { method: 'POST', body: JSON.stringify({ refresh: Auth.getRefresh() }) });
  } catch(e) {}
  Auth.clear();
  showLogin();
}
function showLogin() {
  document.getElementById('loginPage').style.display = 'flex';
  document.getElementById('appShell').style.display  = 'none';
}
function bootApp(user) {
  document.getElementById('loginPage').style.display = 'none';
  document.getElementById('appShell').style.display  = 'flex';
  document.getElementById('appShell').style.flexDirection = 'column';
  document.getElementById('roleLabel').textContent = user.role === 'student' ? 'Student Portal' : 'Lecturer Portal';
  document.getElementById('topAvatar').textContent = initials(user.full_name);
  buildNav();
  switchSection('dashboard');
  loadNotifCount();
}

// Auto-login if token exists
window.addEventListener('DOMContentLoaded', () => {
  const user = Auth.getUser();
  if (user && Auth.getAccess()) { currentRole = user.role; bootApp(user); }
});

// ═══════════════════════════════════════════════════════════
// NAVIGATION
// ═══════════════════════════════════════════════════════════
function buildNav() {
  const tabs = currentRole === 'student' ? [
    {id:'dashboard',icon:'🏠',label:'Home'},
    {id:'assignments',icon:'📝',label:'Assignments'},
    {id:'classes',icon:'💻',label:'Classes'},
    {id:'cat',icon:'📋',label:'Online CAT'},
    {id:'modules',icon:'📚',label:'Modules'},
    {id:'revision',icon:'📄',label:'Revision'},
    {id:'collaborate',icon:'🤝',label:'Collaborate'},
    {id:'profile',icon:'👤',label:'Profile'},
  ] : [
    {id:'dashboard',icon:'📊',label:'Dashboard'},
    {id:'students',icon:'👥',label:'Students'},
    {id:'assignments',icon:'📝',label:'Assignments'},
    {id:'classes',icon:'💻',label:'Classes'},
    {id:'cat',icon:'📋',label:'CAT Manager'},
    {id:'notes',icon:'💬',label:'Notes'},
    {id:'collaborate',icon:'🤝',label:'Rooms'},
    {id:'profile',icon:'👤',label:'Profile'},
  ];
  document.getElementById('topnavTabs').innerHTML = tabs.map(t =>
    `<div class="tnav" id="tab_${t.id}" onclick="switchSection('${t.id}')">${t.icon} ${t.label}</div>`
  ).join('');
}
function switchSection(id) {
  currentSection = id;
  document.querySelectorAll('.tnav').forEach(t => t.classList.remove('active'));
  const tab = document.getElementById('tab_' + id);
  if (tab) tab.classList.add('active');
  document.getElementById('contentArea').innerHTML = loading();
  const fns = {
    dashboard:   currentRole === 'student' ? renderStudentDashboard : renderLecturerDashboard,
    assignments: currentRole === 'student' ? renderStudentAssignments : renderLecturerAssignments,
    classes:     renderClasses,
    cat:         currentRole === 'student' ? renderStudentCAT : renderLecturerCAT,
    modules:     renderModules,
    revision:    renderRevision,
    collaborate: renderCollaborate,
    profile:     renderProfile,
    students:    renderStudents,
    notes:       renderNotes,
  };
  (fns[id] || (() => { document.getElementById('contentArea').innerHTML = '<div class="empty"><div class="empty-icon">🚧</div><p>Coming soon</p></div>'; }))();
}

async function updateModuleProgress(moduleId, totalLessons, title) {
  showModal(`
    <div class="modal-header"><span class="modal-title">📚 ${esc(title)}</span><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <div class="form-group"><label class="form-label">Lessons Completed (out of ${totalLessons})</label>
        <input type="number" class="form-control" id="lessons_done" min="0" max="${totalLessons}" value="0">
      </div>
      <div style="display:flex;gap:10px">
        <button class="btn btn-outline" style="flex:1" onclick="closeModal()">Cancel</button>
        <button class="btn btn-accent" style="flex:1" onclick="saveModuleProgress(${moduleId})">Save Progress</button>
      </div>
    </div>`);
  // Load current progress
  try {
    const p = await apiJSON(`/courses/modules/${moduleId}/progress/`);
    document.getElementById('lessons_done').value = p.lessons_done || 0;
  } catch(e) {}
}

async function saveModuleProgress(moduleId) {
  const lessons_done = parseInt(document.getElementById('lessons_done').value) || 0;
  try {
    await apiJSON(`/courses/modules/${moduleId}/progress/`, {
      method: 'PATCH',
      body: JSON.stringify({ lessons_done }),
    });
    closeModal();
    renderModules();
  } catch(e) { alert(e.message); }
}

let catTimerInterval = null;

async function startCAT(catId, title, durationMins) {
  try {
    // Start attempt
    await apiJSON(`/assessments/${catId}/start/`, { method: 'POST' });
    // Get full CAT with questions
    const cat = await apiJSON(`/assessments/${catId}/`);
    let timeLeft = durationMins * 60;
    const answers = {};

    showModal(`
    <div class="modal-header">
      <span class="modal-title">📋 ${esc(title)}</span>
      <div id="catTimer" style="font-family:var(--mono);font-size:16px;color:var(--accent)">⏱ ${fmtTimer(timeLeft)}</div>
    </div>
    <div class="modal-body">
      ${(cat.questions||[]).map((q,qi) => `
      <div style="margin-bottom:24px;padding:18px;background:var(--bg3);border-radius:12px;border:1px solid var(--border)">
        <div style="font-size:14px;font-weight:700;margin-bottom:14px">${qi+1}. ${esc(q.text)}</div>
        ${Object.entries(q.options||{}).map(([letter,opt]) => `
        <label style="display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;border:1.5px solid var(--border);margin-bottom:8px;cursor:pointer;transition:all .2s" id="opt_${qi}_${letter}">
          <input type="radio" name="q${qi}" value="${letter}" onchange="selectCATOpt(${qi},'${letter}',${q.id})" style="accent-color:var(--accent)">
          <span style="font-size:13px"><strong>${letter}.</strong> ${esc(opt)}</span>
        </label>`).join('')}
      </div>`).join('')}
      <button class="btn btn-accent" style="width:100%" onclick="submitCATAnswers(${catId})">✅ Submit CAT</button>
    </div>`, 'lg');

    window._catAnswers = {};
    if (catTimerInterval) clearInterval(catTimerInterval);
    catTimerInterval = setInterval(() => {
      timeLeft--;
      const el = document.getElementById('catTimer');
      if (el) el.textContent = `⏱ ${fmtTimer(timeLeft)}`;
      if (timeLeft <= 0) { clearInterval(catTimerInterval); submitCATAnswers(catId); }
    }, 1000);
  } catch(e) { alert(e.message); }
}

function selectCATOpt(qi, letter, questionId) {
  if (!window._catAnswers) window._catAnswers = {};
  window._catAnswers[questionId] = letter;
  document.querySelectorAll(`[id^="opt_${qi}_"]`).forEach(el => el.style.borderColor = 'var(--border)');
  const sel = document.getElementById(`opt_${qi}_${letter}`);
  if (sel) sel.style.borderColor = 'var(--accent)';
}

function fmtTimer(s) {
  const m = Math.floor(s/60), sec = s%60;
  return `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
}

async function submitCATAnswers(catId) {
  if (catTimerInterval) clearInterval(catTimerInterval);
  const answers = Object.entries(window._catAnswers||{}).map(([qId, chosen]) => ({
    question: parseInt(qId), chosen_ans: chosen
  }));
  try {
    const result = await apiJSON(`/assessments/${catId}/submit/`, {
      method: 'POST',
      body: JSON.stringify({ answers }),
    });
    closeModal();
    showModal(`
    <div class="modal-header"><span class="modal-title">🎉 CAT Results</span><button class="modal-close" onclick="closeModal();renderStudentCAT()">✕</button></div>
    <div class="modal-body" style="text-align:center">
      <div style="font-size:72px;margin-bottom:12px">${result.percentage>=70?'🏆':result.percentage>=50?'😊':'😔'}</div>
      <div style="font-size:48px;font-weight:900;color:${gradeColor(result.percentage)}">${result.percentage}%</div>
      <div style="font-size:16px;color:var(--muted);margin-top:6px">${result.score} / ${result.total} correct</div>
      <div style="font-size:14px;margin-top:16px;padding:14px;background:var(--bg3);border-radius:10px">${esc(result.message)}</div>
      <button class="btn btn-primary" style="margin-top:20px;width:100%" onclick="closeModal();renderStudentCAT()">Done</button>
    </div>`);
  } catch(e) { alert(e.message); }
}

async function sendRoomMessage(roomId) {
  const inp = document.getElementById('chatInputModal');
  const text = inp.value.trim();

    openRoomChat(roomId, '');
  } catch(e) { alert(e.message); }
}

function downloadReport() {
  const user = Auth.getUser();
  const token = Auth.getAccess();
  const url = `${API_BASE}/reports/student/${user.id}/?format=pdf`;
  const a = document.createElement('a');
  a.href = url;
  a.download = `KITI_Report_${user.id}.pdf`;
  // Include auth via header not possible with <a>, use fetch
  fetch(url, { headers: { 'Authorization': `Bearer ${token}` } })
    .then(r => r.blob())
    .then(blob => {
      const blobUrl = URL.createObjectURL(blob);
      a.href = blobUrl;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(blobUrl);
    }).catch(e => alert('PDF generation failed: ' + e.message));
}

    </div>`, 'lg');
  } catch(e) { alert(e.message); }
}

function downloadStudentReport(id, name) {
  const token = Auth.getAccess();
  fetch(`${API_BASE}/reports/student/${id}/?format=pdf`, {
    headers: { 'Authorization': `Bearer ${token}` }
  }).then(r => r.blob()).then(blob => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `KITI_Report_${name.replace(/\s+/g,'_')}.pdf`;
    document.body.appendChild(a); a.click();
    document.body.removeChild(a); URL.revokeObjectURL(url);
  }).catch(e => alert('PDF failed: ' + e.message));
}

  } catch(e) { document.getElementById('contentArea').innerHTML = errBox(e.message); }

function renderNoteItems(notes) {
  if (!notes.length) return '<div class="empty"><div class="empty-icon">💬</div><p>No notes yet.</p></div>';
  const typeIcon = {note:'📝',feedback:'💬',commendation:'⭐',warning:'⚠️',instruction:'📋'};
  return notes.map(n => `
  <div style="padding:14px;background:var(--bg3);border-radius:10px;margin-bottom:10px">
    <div style="display:flex;justify-content:space-between;margin-bottom:8px">
      <div style="display:flex;align-items:center;gap:8px">
        <div class="av av-sm" style="${avStyle(n.student_name||'?')}">${initials(n.student_name||'?')}</div>
        <div><div style="font-size:13px;font-weight:600">${esc(n.student_name||'')}</div>
        <div style="font-size:11px;color:var(--muted)">${fmtDate(n.created_at)} · ${esc(n.author_name)}</div></div>
      </div>
      <div style="display:flex;align-items:center;gap:6px">
        <span style="font-size:14px">${typeIcon[n.type]||'📝'}</span>
        <button onclick="deleteNote(${n.id})" style="background:none;border:none;cursor:pointer;color:var(--muted);font-size:14px">✕</button>
      </div>
    </div>
    <div style="font-size:13px;line-height:1.6">${esc(n.content)}</div>
  </div>`).join('');
}

async function filterNotesList() {
  const studentId = document.getElementById('noteFilter').value;
  const url = studentId ? `/assignments/notes/?student=${studentId}` : '/assignments/notes/';
  try {
    const notes = await apiJSON(url);
    document.getElementById('notesList').innerHTML = renderNoteItems(notes.results||notes);
  } catch(e) {}
}

async function postNote() {
  const content = document.getElementById('note_content').value.trim();
  if (!content) { alert('Message required.'); return; }
  try {
    await apiJSON('/assignments/notes/', {
      method: 'POST',
      body: JSON.stringify({
        student:  parseInt(document.getElementById('note_student').value),
        type:     document.getElementById('note_type').value,
        content,
      }),
    });
    document.getElementById('note_content').value = '';
    const notes = await apiJSON('/assignments/notes/');
    document.getElementById('notesList').innerHTML = renderNoteItems(notes.results||notes);
  } catch(e) { alert(e.message); }
}

async function deleteNote(id) {
  try {
    await api(`/assignments/notes/${id}/`, { method: 'DELETE' });
    const notes = await apiJSON('/assignments/notes/');
    document.getElementById('notesList').innerHTML = renderNoteItems(notes.results||notes);
  } catch(e) { alert(e.message); }
}

  <div class="modal-body">
    <div style="background:var(--bg3);border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:14px;color:var(--accent)">Max marks: ${maxMarks}</div>
    <div class="form-group"><label class="form-label">Your Answer / Work Description</label>

    </div>
    <div class="form-group"><label class="form-label">Upload File (PDF, DOCX, ZIP, etc.)</label>
      <input type="file" class="form-control" id="sub_file" accept=".pdf,.doc,.docx,.zip,.txt,.py,.html,.xlsx">

async function submitAssignment(id) {
  const text = document.getElementById('sub_text').value.trim();
  const file = document.getElementById('sub_file').files[0];
  if (!text && !file) { alert('Please add your answer or upload a file.'); return; }

  let fileId = null;
  if (file) {
    try {
      const fd = new FormData();
      fd.append('file', file);
      fd.append('category', 'submission');
      const uploaded = await apiJSON('/uploads/', { method: 'POST', body: fd });
      fileId = uploaded.id;
    } catch(e) { alert('File upload failed: ' + e.message); return; }
  }

  try {
    const fd = new FormData();
    fd.append('text_content', text);
    if (file) fd.append('file', file);
    await apiJSON(`/assignments/${id}/submit/`, { method: 'POST', body: fd });
    closeModal();
    alert('Assignment submitted successfully! ✅');
    renderStudentAssignments();
  } catch(e) { alert(e.message); }
}

async function openGradingModal(id, title, maxMarks) {
  try {
    const [submissions, students] = await Promise.all([
      apiJSON(`/assignments/${id}/submissions/`),
      apiJSON('/accounts/students/'),
    ]);
    const subMap = {};
    (submissions.results||submissions).forEach(s => { subMap[s.student] = s; });
    showModal(`
    <div class="modal-header"><span class="modal-title">📊 Grade: ${esc(title)}</span><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <table>
        <thead><tr><th>Student</th><th>Score / ${maxMarks}</th><th>Feedback</th><th></th></tr></thead>
        <tbody>
        ${(students.results||students).map(s => {
          const sub = subMap[s.id];
          return `<tr>
            <td><div style="display:flex;align-items:center;gap:8px"><div class="av av-sm" style="${avStyle(s.full_name)}">${initials(s.full_name)}</div>${esc(s.full_name)}</div></td>
            <td><input type="number" class="form-control" id="gs_${s.id}" value="${sub?.marks_obtained??''}" min="0" max="${maxMarks}" style="width:80px;padding:6px"></td>
            <td><input class="form-control" id="gf_${s.id}" value="${esc(sub?.feedback||'')}" placeholder="feedback" style="font-size:12px"></td>
            <td><button class="btn btn-accent btn-xs" onclick="saveGrade('${sub?.id||''}',${s.id},${id})">✓</button></td>
          </tr>`;
        }).join('')}
        </tbody>
      </table>
    </div>`, 'lg');
  } catch(e) { alert(e.message); }
}

async function saveGrade(subId, studentId, assignId) {
  const score = parseInt(document.getElementById('gs_'+studentId).value);
  const feedback = document.getElementById('gf_'+studentId).value;
  if (isNaN(score)) { alert('Enter a score first.'); return; }
  try {
    if (subId) {
      await apiJSON(`/assignments/submissions/${subId}/grade/`, {
        method: 'PATCH', body: JSON.stringify({ marks_obtained: score, feedback }),
      });
    } else {
      // Submit on behalf then grade
      const fd = new FormData();
      fd.append('text_content', 'Graded by lecturer');
      const sub = await apiJSON(`/assignments/${assignId}/submit/`, { method: 'POST', body: fd });
      await apiJSON(`/assignments/submissions/${sub.id}/grade/`, {
        method: 'PATCH', body: JSON.stringify({ marks_obtained: score, feedback }),
      });
    }
    alert('Grade saved!');
  } catch(e) { alert(e.message); }
}

function openAddQuestionModal(catId, catTitle) {
  showModal(`
  <div class="modal-header"><span class="modal-title">➕ Add Question to: ${esc(catTitle)}</span><button class="modal-close" onclick="closeModal();renderLecturerCAT()">✕</button></div>

    <div class="form-group"><label class="form-label">Question</label><textarea class="form-control" id="q_text" rows="3"></textarea></div>
    ${['A','B','C','D'].map(l => `<div class="form-group"><label class="form-label">Option ${l}</label><input class="form-control" id="q_opt${l}" placeholder="Option ${l}"></div>`).join('')}
    <div class="form-group"><label class="form-label">Correct Answer</label>
      <select class="form-control" id="q_ans"><option value="A">A</option><option value="B">B</option><option value="C">C</option><option value="D">D</option></select>
    </div>
    <div style="display:flex;gap:10px">
      <button class="btn btn-outline" style="flex:1" onclick="closeModal();renderLecturerCAT()">Done</button>
      <button class="btn btn-accent" style="flex:1" onclick="saveQuestion(${catId},'${esc(catTitle)}')">Save & Add Another</button>
    </div>
  </div>`);
}

async function saveQuestion(catId, catTitle) {
  const text = document.getElementById('q_text').value.trim();
  if (!text) { alert('Question text required.'); return; }
  try {
    await apiJSON(`/assessments/${catId}/questions/`, {
      method: 'POST',
      body: JSON.stringify({
        text, cat: catId,
        option_a: document.getElementById('q_optA').value,
        option_b: document.getElementById('q_optB').value,
        option_c: document.getElementById('q_optC').value,
        option_d: document.getElementById('q_optD').value,
        correct_ans: document.getElementById('q_ans').value,
        order: 0,
      }),
    });
    alert('Question saved! Add another or close.');
    openAddQuestionModal(catId, catTitle);
  } catch(e) { alert(e.message); }
}

async function saveRevisionPaper() {
  const title = document.getElementById('rp_title').value.trim();
  if (!title) { alert('Title required.'); return; }
  const file = document.getElementById('rp_file').files[0];
  const fd = new FormData();
  fd.append('title', title);
  fd.append('subject', document.getElementById('rp_sub').value);
  fd.append('year', document.getElementById('rp_year').value);
  fd.append('paper', document.getElementById('rp_paper').value);
  fd.append('type', document.getElementById('rp_type').value);
  if (file) fd.append('file', file);
  try {
    await api('/courses/revision-papers/', { method: 'POST', body: fd });
    closeModal(); renderRevision();
  } catch(e) { alert(e.message); }
}

function showForgotPassword() {
  showModal(`
  <div class="modal-header"><span class="modal-title">🔐 Reset Password</span><button class="modal-close" onclick="closeModal()">✕</button></div>
  <div class="modal-body">
    <p style="color:var(--muted);font-size:13px;margin-bottom:16px">Enter your email and we'll send a reset link.</p>
    <div id="resetAlert" class="alert-box alert-error"></div>
    <div id="resetSuccess" class="alert-box alert-success"></div>
    <div class="form-group"><label class="form-label">Email Address</label>
      <input class="form-control" id="reset_email" type="email" placeholder="alice@kiti.ac.ke">
    </div>
    <button class="btn btn-accent" style="width:100%" onclick="requestReset()">Send Reset Link</button>
  </div>`);
}

async function requestReset() {
  const email = document.getElementById('reset_email').value.trim();
  if (!email) { showAlert(document.getElementById('resetAlert'), 'Email required.'); return; }
  try {
    const res = await fetch(`${API_BASE}/auth/password-reset/`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email }),
    });
    const data = await res.json();
    document.getElementById('resetAlert').style.display = 'none';
    const s = document.getElementById('resetSuccess');
    s.textContent = data.detail;
    s.style.display = 'block';
  } catch(e) {
    showAlert(document.getElementById('resetAlert'), 'Request failed. Try again.');
  }
}
