<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KITI ICT Department</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0d14;--bg2:#0f1320;--bg3:#141827;--bg4:#1a2035;
  --accent:#00f5d4;--accent2:#7c3aed;--accent3:#f59e0b;
  --green:#10b981;--red:#ef4444;--blue:#3b82f6;
  --text:#e8eaf0;--muted:#6b7280;--border:#1e2640;
  --card:#111827;--card2:#161d30;
  --font:'DM Sans',sans-serif;--mono:'Space Mono',monospace;--display:'Orbitron',sans-serif;
}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}

/* ── PAGES ── */
.page{display:none;min-height:100vh}
.page.active{display:block}

/* ── LOGIN PAGE ── */
#loginPage{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:var(--bg);position:relative;overflow:hidden;
}
.login-grid{
  position:absolute;inset:0;
  background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);
  background-size:50px 50px;opacity:.4;
}
.login-glow{position:absolute;width:600px;height:600px;background:radial-gradient(circle,#7c3aed22 0%,transparent 70%);top:-100px;right:-100px}
.login-glow2{position:absolute;width:400px;height:400px;background:radial-gradient(circle,#00f5d422 0%,transparent 70%);bottom:-100px;left:-100px}
.login-wrap{position:relative;z-index:10;width:100%;max-width:480px;padding:20px}
.kiti-logo{text-align:center;margin-bottom:40px}
.kiti-logo h1{font-family:var(--display);font-size:28px;font-weight:900;color:var(--accent);letter-spacing:3px;text-shadow:0 0 30px #00f5d466}
.kiti-logo p{color:var(--muted);font-size:13px;letter-spacing:2px;margin-top:6px;text-transform:uppercase}
.login-card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:36px;backdrop-filter:blur(20px)}
.login-card h2{font-size:22px;font-weight:700;margin-bottom:6px}
.login-card p{color:var(--muted);font-size:13px;margin-bottom:28px}
.role-select{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:24px}
.role-btn{
  border:1.5px solid var(--border);background:var(--bg2);border-radius:12px;
  padding:18px 12px;cursor:pointer;text-align:center;transition:all .25s;
}
.role-btn:hover{border-color:var(--accent);transform:translateY(-2px)}
.role-btn.selected{border-color:var(--accent);background:#00f5d410;box-shadow:0 0 20px #00f5d420}
.role-btn .ri{font-size:32px;margin-bottom:8px}
.role-btn span{display:block;font-weight:600;font-size:14px}
.role-btn small{color:var(--muted);font-size:11px}
.form-group{margin-bottom:16px}
.form-label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.form-input{
  width:100%;background:var(--bg2);border:1.5px solid var(--border);border-radius:10px;
  padding:12px 14px;font-size:14px;color:var(--text);font-family:var(--font);outline:none;
  transition:border .2s;
}
.form-input:focus{border-color:var(--accent)}
.form-input::placeholder{color:#374151}
.btn-login{
  width:100%;padding:14px;border:none;border-radius:10px;font-size:15px;font-weight:700;
  cursor:pointer;font-family:var(--font);letter-spacing:.5px;transition:all .25s;
  background:linear-gradient(135deg,var(--accent2),var(--accent));color:#fff;
  box-shadow:0 4px 20px #7c3aed44;
}
.btn-login:hover{transform:translateY(-2px);box-shadow:0 8px 30px #7c3aed66}
.demo-hint{text-align:center;margin-top:14px;font-size:12px;color:var(--muted)}
.demo-hint span{color:var(--accent);cursor:pointer}

/* ── APP SHELL ── */
#appShell{display:none;min-height:100vh;flex-direction:column}
#appShell.visible{display:flex}
.topnav{
  background:var(--card);border-bottom:1px solid var(--border);
  padding:0 24px;height:60px;display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:200;
}
.topnav-logo{font-family:var(--display);font-size:15px;font-weight:900;color:var(--accent);letter-spacing:2px}
.topnav-logo span{color:var(--muted);font-weight:400;font-size:12px;margin-left:8px;font-family:var(--font)}
.topnav-tabs{display:flex;gap:2px}
.tnav{
  padding:8px 14px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:500;
  color:var(--muted);transition:all .2s;display:flex;align-items:center;gap:6px;white-space:nowrap;
}
.tnav:hover{color:var(--text);background:var(--bg3)}
.tnav.active{color:var(--accent);background:#00f5d412}
.tnav .tnav-icon{font-size:15px}
.topnav-right{display:flex;align-items:center;gap:12px}
.notif-btn{width:36px;height:36px;border-radius:8px;background:var(--bg3);border:1px solid var(--border);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;position:relative}
.notif-dot{position:absolute;top:6px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--red);border:1.5px solid var(--card)}
.avatar-btn{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--accent2),var(--accent));display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;cursor:pointer;border:2px solid var(--accent)}
.content-area{flex:1;padding:28px 28px;max-width:1400px;width:100%;margin:0 auto}

/* ── SECTION PANELS ── */
.section{display:none}
.section.active{display:block}

/* ── CARDS ── */
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:22px}
.card-sm{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px}
.card-title{font-size:14px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.card-title .title-text{display:flex;align-items:center;gap:8px}

/* ── GRID ── */
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.g2{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
.g2-3{display:grid;grid-template-columns:1fr 1.5fr;gap:20px}

/* ── STATS ── */
.stat{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px}
.stat-icon{font-size:24px;margin-bottom:10px}
.stat-val{font-size:30px;font-weight:700;line-height:1}
.stat-label{font-size:12px;color:var(--muted);margin-top:4px;font-weight:500}
.stat-sub{font-size:11px;color:var(--muted);margin-top:2px}

/* ── BADGE ── */
.badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:700;gap:4px}
.b-green{background:#10b98122;color:#34d399}.b-red{background:#ef444422;color:#f87171}
.b-blue{background:#3b82f622;color:#60a5fa}.b-amber{background:#f59e0b22;color:#fbbf24}
.b-purple{background:#7c3aed22;color:#a78bfa}.b-cyan{background:#00f5d422;color:#00f5d4}
.b-gray{background:#37415122;color:#9ca3af}
/* live */
.live-pill{display:inline-flex;align-items:center;gap:5px;background:#ef444422;color:#f87171;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:700}
.live-dot{width:6px;height:6px;border-radius:50%;background:#ef4444;animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* ── BTN ── */
.btn{padding:9px 18px;border-radius:9px;border:none;cursor:pointer;font-size:13px;font-weight:600;font-family:var(--font);transition:all .2s;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn-primary{background:var(--accent2);color:#fff}.btn-primary:hover{background:#6d28d9}
.btn-accent{background:var(--accent);color:#0a0d14}.btn-accent:hover{filter:brightness(1.1)}
.btn-outline{background:transparent;color:var(--text);border:1px solid var(--border)}.btn-outline:hover{background:var(--bg3);border-color:#374151}
.btn-danger{background:var(--red);color:#fff}.btn-danger:hover{background:#dc2626}
.btn-success{background:var(--green);color:#fff}.btn-success:hover{background:#059669}
.btn-sm{padding:5px 12px;font-size:12px;border-radius:7px}
.btn-xs{padding:4px 9px;font-size:11px;border-radius:6px}
.btn-ghost{background:transparent;color:var(--muted);border:none}.btn-ghost:hover{color:var(--text)}

/* ── TABLE ── */
.table-wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--border)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--bg3);padding:11px 14px;text-align:left;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border)}
td{padding:11px 14px;border-bottom:1px solid #1a2035;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--bg3)}

/* ── FORM ── */
.form-group{margin-bottom:14px}
.form-label{display:block;font-size:11px;font-weight:700;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px}
.form-control{width:100%;background:var(--bg2);border:1.5px solid var(--border);border-radius:9px;padding:10px 13px;font-size:13px;color:var(--text);font-family:var(--font);outline:none;transition:border .2s}
.form-control:focus{border-color:var(--accent)}
.form-control::placeholder{color:#374151}
textarea.form-control{resize:vertical;min-height:90px}
select.form-control{cursor:pointer}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* ── MODAL ── */
.overlay{position:fixed;inset:0;background:#00000099;display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px;backdrop-filter:blur(4px)}
.modal{background:var(--card);border:1px solid var(--border);border-radius:20px;width:100%;max-width:540px;max-height:90vh;overflow-y:auto}
.modal-lg{max-width:720px}
.modal-header{padding:22px 24px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--card);z-index:1;border-radius:20px 20px 0 0}
.modal-title{font-size:17px;font-weight:700}
.modal-close{background:none;border:none;font-size:20px;cursor:pointer;color:var(--muted);padding:4px;line-height:1;border-radius:6px;transition:all .2s}
.modal-close:hover{color:var(--text);background:var(--bg3)}
.modal-body{padding:24px}

/* ── PROGRESS ── */
.progress{background:var(--bg3);border-radius:99px;height:6px;overflow:hidden}
.progress-bar{height:100%;border-radius:99px;transition:width .4s}

/* ── AVATAR ── */
.av{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0}
.av-sm{width:32px;height:32px;font-size:12px}
.av-md{width:42px;height:42px;font-size:15px}
.av-lg{width:60px;height:60px;font-size:20px}

/* ── CHAT ── */
.chat-area{border:1px solid var(--border);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;height:480px}
.chat-header{background:var(--bg3);padding:14px 18px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border)}
.chat-msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg-row{display:flex;gap:10px;align-items:flex-end}
.msg-row.own{flex-direction:row-reverse}
.msg-bubble{max-width:75%;padding:10px 14px;border-radius:14px;font-size:13px;line-height:1.5}
.msg-bubble.them{background:var(--bg3);border-radius:14px 14px 14px 4px}
.msg-bubble.own{background:var(--accent2);border-radius:14px 14px 4px 14px}
.msg-time{font-size:10px;color:var(--muted);margin-top:2px;text-align:right}
.chat-input-bar{padding:14px 16px;border-top:1px solid var(--border);display:flex;gap:10px;background:var(--bg2)}
.chat-input{flex:1;background:var(--bg3);border:1.5px solid var(--border);border-radius:10px;padding:10px 14px;font-size:13px;color:var(--text);outline:none;font-family:var(--font)}
.chat-input:focus{border-color:var(--accent)}

/* ── CODE EDITOR ── */
.code-editor{background:#0d1117;border:1px solid #30363d;border-radius:12px;overflow:hidden;font-family:var(--mono)}
.code-topbar{background:#161b22;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #30363d}
.code-dots{display:flex;gap:6px}.code-dots span{width:12px;height:12px;border-radius:50%}
.code-body{padding:20px;font-size:13px;line-height:1.6;color:#c9d1d9;min-height:220px;outline:none;white-space:pre;overflow-x:auto}
.code-body[contenteditable]{cursor:text}
.code-body:focus{outline:none}
.ln{color:#484f58;user-select:none;margin-right:12px}
.kw{color:#ff7b72}.fn{color:#d2a8ff}.str{color:#a5d6ff}.cm{color:#8b949e;font-style:italic}.num{color:#79c0ff}

/* ── MODULE CARD ── */
.module-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;transition:all .25s;cursor:pointer}
.module-card:hover{border-color:var(--accent);transform:translateY(-3px);box-shadow:0 8px 30px #00f5d415}
.module-icon{font-size:36px;margin-bottom:12px}
.module-title{font-size:14px;font-weight:700;margin-bottom:6px}
.module-sub{font-size:12px;color:var(--muted);line-height:1.5}
.module-tag{display:inline-flex;align-items:center;gap:4px;background:var(--bg3);padding:3px 8px;border-radius:99px;font-size:10px;color:var(--muted);margin-top:8px;margin-right:4px}

/* ── REVISION ── */
.rev-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;display:flex;align-items:center;gap:14px;transition:all .2s;cursor:pointer}
.rev-card:hover{border-color:var(--accent2)}
.rev-icon{font-size:28px;flex-shrink:0}
.rev-info{flex:1}
.rev-title{font-weight:600;font-size:14px;margin-bottom:3px}
.rev-sub{font-size:12px;color:var(--muted)}

/* ── ASSIGNMENT CARD ── */
.assign-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:12px}
.assign-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.assign-title{font-weight:700;font-size:15px}
.assign-meta{font-size:12px;color:var(--muted);display:flex;gap:14px;margin-bottom:12px}
.assign-desc{font-size:13px;color:#9ca3af;line-height:1.6;margin-bottom:14px}

/* ── PROFILE ── */
.profile-banner{height:140px;background:linear-gradient(135deg,#1e1b4b,#0f172a);border-radius:16px 16px 0 0;position:relative}
.profile-av-wrap{position:absolute;bottom:-28px;left:24px}
.profile-info{padding:44px 24px 20px}
.profile-name{font-size:22px;font-weight:800}
.profile-sub{font-size:13px;color:var(--muted);margin-top:2px}
.profile-stats{display:flex;gap:24px;margin-top:14px}
.pstat{text-align:center}.pstat-val{font-size:20px;font-weight:700}.pstat-l{font-size:11px;color:var(--muted);margin-top:1px}

/* ── NOTIFICATION ── */
.notif-item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
.notif-item:last-child{border-bottom:none}
.notif-dot2{width:8px;height:8px;border-radius:50%;background:var(--accent);margin-top:4px;flex-shrink:0}
.notif-body{font-size:13px;flex:1}
.notif-time{font-size:11px;color:var(--muted);margin-top:2px}

/* ── MISC ── */
.divider{border:none;border-top:1px solid var(--border);margin:16px 0}
.empty{text-align:center;padding:48px;color:var(--muted)}
.empty-icon{font-size:48px;margin-bottom:12px}
.empty p{font-size:14px}
.tag{display:inline-block;background:var(--bg3);color:var(--muted);border-radius:6px;padding:2px 8px;font-size:11px;margin-right:4px}
.green{color:var(--green)}.red{color:var(--red)}.accent{color:var(--accent)}.amber{color:var(--accent3)}
.scroll-y{overflow-y:auto}
.sep{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px;margin:16px 0}
.sep::before,.sep::after{content:'';flex:1;border-top:1px solid var(--border)}
input[type=file]{color:var(--muted);font-size:13px}

/* ── ROOM ── */
.room-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px}
.room-header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.room-name{font-weight:700;font-size:15px}
.room-members{display:flex;margin-top:8px}
.room-av{width:26px;height:26px;border-radius:50%;border:2px solid var(--card);margin-left:-6px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700}
.room-av:first-child{margin-left:0}

/* ── SCROLLBAR ── */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#374151;border-radius:99px}
::-webkit-scrollbar-thumb:hover{background:#4b5563}
</style>
</head>
<body>

<!-- ════════════════ LOGIN PAGE ════════════════ -->
<div id="loginPage" class="page active">
  <div class="login-grid"></div>
  <div class="login-glow"></div>
  <div class="login-glow2"></div>
  <div class="login-wrap">
    <div class="kiti-logo">
      <h1>KITI</h1>
      <p>ICT Department Portal</p>
    </div>
    <div class="login-card">
      <h2>Welcome Back</h2>
      <p>Select your role to continue</p>
      <div class="role-select">
        <div class="role-btn selected" id="roleStudent" onclick="selectRole('student')">
          <div class="ri">🎓</div>
          <span>Student</span>
          <small>Access your portal</small>
        </div>
        <div class="role-btn" id="roleLecturer" onclick="selectRole('lecturer')">
          <div class="ri">👨‍🏫</div>
          <span>Lecturer</span>
          <small>Manage your classes</small>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Username / Student ID</label>
        <input class="form-input" id="loginUser" placeholder="e.g. D012/ICT/2024 or staff@kiti.ac.ke" value="student01">
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" class="form-input" id="loginPass" placeholder="Enter your password" value="password">
      </div>
      <button class="btn-login" onclick="doLogin()">Sign In →</button>
      <div class="demo-hint">Demo: click <span onclick="fillDemo('student')">Student</span> or <span onclick="fillDemo('lecturer')">Lecturer</span> then Sign In</div>
    </div>
  </div>
</div>

<!-- ════════════════ APP SHELL ════════════════ -->
<div id="appShell">
  <nav class="topnav">
    <div class="topnav-logo">KITI <span id="roleLabel">Student Portal</span></div>
    <div class="topnav-tabs" id="topnavTabs"></div>
    <div class="topnav-right">
      <div class="notif-btn" onclick="openNotifModal()">🔔<div class="notif-dot"></div></div>
      <div class="avatar-btn" id="topAvatar" onclick="switchSection('profile')">S</div>
    </div>
  </nav>
  <div class="content-area" id="contentArea">
    <!-- sections injected here -->
  </div>
</div>

<!-- Modal container -->
<div id="modalRoot"></div>

<script>
// ═══════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════
let role = 'student';
let currentSection = 'dashboard';
let chatRooms = {
  'general': [{user:'Alice Kamau',own:false,text:'Hey team! Has everyone seen the new Python module?',time:'10:23'},{user:'Brian O.',own:false,text:'Just checked it — looks intense 😅',time:'10:25'},{user:'Me',own:true,text:'Starting it tonight after the CA 🔥',time:'10:28'}],
  'cybersec': [{user:'Grace N.',own:false,text:'Anyone done the Kali Linux lab?',time:'11:00'},{user:'Me',own:true,text:'Yes! The wireshark part was tricky',time:'11:05'}],
  'data-analysis': [{user:'Henry O.',own:false,text:'Pandas DataFrame vs NumPy arrays — which for the assignment?',time:'09:15'}],
};
let activeRoom = 'general';
let catQuestions = [];
let catAnswers = {};
let catTimer = null;
let catTimeLeft = 1800;
let catStarted = false;

const COLORS_BG = ['#7c3aed','#0891b2','#059669','#d97706','#dc2626','#9333ea'];
const COLORS_TXT = ['#ddd6fe','#a5f3fc','#a7f3d0','#fde68a','#fecaca','#e9d5ff'];

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function initials(n){return n.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase()}
function avStyle(name,sz='md'){const i=name.charCodeAt(0)%6;return`background:${COLORS_BG[i]};color:${COLORS_TXT[i]}`}

function selectRole(r){
  role=r;
  document.getElementById('roleStudent').classList.toggle('selected',r==='student');
  document.getElementById('roleLecturer').classList.toggle('selected',r==='lecturer');
  document.getElementById('loginUser').value=r==='student'?'student01':'lecturer01';
}
function fillDemo(r){selectRole(r);document.getElementById('loginUser').value=r==='student'?'student01':'lecturer01';document.getElementById('loginPass').value='password';}
function doLogin(){
  const u=document.getElementById('loginUser').value.trim();
  if(!u){alert('Please enter your username');return;}
  document.getElementById('loginPage').classList.remove('active');
  document.getElementById('appShell').style.display='flex';
  document.getElementById('appShell').style.flexDirection='column';
  document.getElementById('roleLabel').textContent=role==='student'?'Student Portal':'Lecturer Portal';
  const av=document.getElementById('topAvatar');
  const name=role==='student'?'Alice Kamau':'Mr. Omondi';
  av.textContent=initials(name);
  buildNav();
  switchSection('dashboard');
}
function logout(){
  document.getElementById('loginPage').classList.add('active');
  document.getElementById('appShell').style.display='none';
}
function buildNav(){
  const tabs=role==='student'?[
    {id:'dashboard',icon:'🏠',label:'Home'},
    {id:'assignments',icon:'📝',label:'Assignments'},
    {id:'classes',icon:'💻',label:'Classes'},
    {id:'cat',icon:'📋',label:'Online CAT'},
    {id:'modules',icon:'📚',label:'Modules'},
    {id:'revision',icon:'📄',label:'Revision'},
    {id:'collaborate',icon:'🤝',label:'Collaborate'},
    {id:'profile',icon:'👤',label:'Profile'},
  ]:[
    {id:'dashboard',icon:'📊',label:'Dashboard'},
    {id:'students',icon:'👥',label:'Students'},
    {id:'assignments',icon:'📝',label:'Assignments'},
    {id:'classes',icon:'💻',label:'Classes'},
    {id:'cat',icon:'📋',label:'CAT Manager'},
    {id:'notes',icon:'💬',label:'Notes'},
    {id:'collaborate',icon:'🤝',label:'Rooms'},
    {id:'profile',icon:'👤',label:'Profile'},
  ];
  document.getElementById('topnavTabs').innerHTML=tabs.map(t=>`<div class="tnav" id="tab_${t.id}" onclick="switchSection('${t.id}')"><span class="tnav-icon">${t.icon}</span>${t.label}</div>`).join('');
}

// NAVIGATION
// ═══════════════════════════════════════════════════════
function switchSection(id){
  currentSection=id;
  document.querySelectorAll('.tnav').forEach(t=>t.classList.remove('active'));
  const tab=document.getElementById('tab_'+id);
  if(tab) tab.classList.add('active');
  const ca=document.getElementById('contentArea');
  ca.innerHTML='';
  const renders={
    dashboard:role==='student'?renderStudentDashboard:renderLecturerDashboard,
    assignments:role==='student'?renderStudentAssignments:renderLecturerAssignments,
    classes:renderClasses,
    cat:role==='student'?renderStudentCAT:renderLecturerCAT,
    modules:renderModules,
    revision:renderRevision,
    collaborate:renderCollaborate,
    profile:renderProfile,
    students:renderStudents,
    notes:renderNotes,
  };
  (renders[id]||(() => {}))();
}

  ${db.catList.map(cat=>`<div class="assign-card" style="margin-bottom:16px">

    ${cat.status==='upcoming'?`<button class="btn btn-accent" onclick="startCAT('${cat.id}')">▶️ Start CAT</button>`:cat.status==='completed'?`<button class="btn btn-outline" onclick="reviewCAT('${cat.id}')">📊 View Results</button>`:''}
  </div>`).join('')}`;
}
function startCAT(id){
  const cat=db.catList.find(x=>x.id===id);
  if(!cat) return;
  catAnswers={};
  catTimeLeft=cat.duration*60;
  catStarted=true;
  showModal(`
    <div class="modal-header"><span class="modal-title">📋 ${esc(cat.title)}</span><div id="catTimerDisplay" style="font-family:var(--mono);font-size:16px;color:var(--accent)">⏱ ${fmtTimer(catTimeLeft)}</div></div>
    <div class="modal-body">
      <div id="catQsContainer">
        ${cat.questions.map((q,qi)=>`<div style="margin-bottom:24px;padding:18px;background:var(--bg3);border-radius:12px;border:1px solid var(--border)">
          <div style="font-size:14px;font-weight:700;margin-bottom:14px">${qi+1}. ${esc(q.q)}</div>
          ${q.opts.map((opt,oi)=>`<label style="display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;border:1.5px solid var(--border);margin-bottom:8px;cursor:pointer;transition:all .2s" id="opt_${qi}_${oi}">
            <input type="radio" name="q${qi}" value="${oi}" onchange="selectCAT(${qi},${oi})" style="accent-color:var(--accent)">
            <span style="font-size:13px">${esc(opt)}</span>
          </label>`).join('')}
        </div>`).join('')}
      </div>
      <button class="btn btn-accent" style="width:100%" onclick="submitCAT('${id}')">✅ Submit CAT</button>
    </div>
  `,'lg');
  catTimer=setInterval(()=>{catTimeLeft--;document.getElementById('catTimerDisplay').textContent=`⏱ ${fmtTimer(catTimeLeft)}`;if(catTimeLeft<=0){clearInterval(catTimer);submitCAT(id);}},1000);
}
function fmtTimer(s){const m=Math.floor(s/60);const sec=s%60;return`${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`}
function selectCAT(qi,oi){catAnswers[qi]=oi;document.querySelectorAll(`[id^="opt_${qi}_"]`).forEach(el=>el.style.borderColor='var(--border)');const sel=document.getElementById(`opt_${qi}_${oi}`);if(sel)sel.style.borderColor='var(--accent)';}
function submitCAT(id){
  if(catTimer) clearInterval(catTimer);
  const cat=db.catList.find(x=>x.id===id);
  let correct=0;
  cat.questions.forEach((q,i)=>{if(catAnswers[i]===q.ans)correct++;});
  const pct=Math.round(correct/cat.questions.length*100);
  closeModal();
  showModal(`<div class="modal-header"><span class="modal-title">🎉 CAT Results</span><button class="modal-close" onclick="closeModal()">✕</button></div>
  <div class="modal-body" style="text-align:center">
    <div style="font-size:72px;margin-bottom:12px">${pct>=70?'🏆':pct>=50?'😊':'😔'}</div>
    <div style="font-size:48px;font-weight:900;color:${pct>=70?'var(--green)':pct>=50?'var(--accent)':'var(--red)'}">${pct}%</div>
    <div style="font-size:16px;color:var(--muted);margin-top:6px">${correct} / ${cat.questions.length} correct</div>
    <div style="font-size:14px;margin-top:16px;padding:14px;background:var(--bg3);border-radius:10px">${pct>=80?'Excellent work! Outstanding performance.':pct>=65?'Good job! Keep it up.':pct>=50?'Pass. Review the topics you missed.':'Below pass mark. Please revise and speak to your lecturer.'}</div>
    <button class="btn btn-primary" style="margin-top:20px;width:100%" onclick="closeModal()">Done</button>
  </div>`);
}

function buildChat(){
  const msgs=chatRooms[activeRoom]||[];
  return`<div class="chat-area" style="border:none;border-radius:0;height:360px">
    <div class="chat-msgs" id="chatMsgs">
      ${msgs.map(m=>`<div class="msg-row ${m.own?'own':''}">

      </div>`).join('')}
    </div>
    <div class="chat-input-bar">
      <input class="chat-input" id="chatInputEl" placeholder="Type a message..." onkeydown="if(event.key==='Enter')sendChatMsg()">
      <button class="btn btn-primary btn-sm" onclick="sendChatMsg()">Send</button>

function buildQuickCode(){
  const cr=db.codeRooms[0];
  return`<div class="code-editor">
    <div class="code-topbar">
      <div style="display:flex;align-items:center;gap:10px">
        <div class="code-dots"><span style="background:#ff5f56"></span><span style="background:#ffbd2e"></span><span style="background:#27c93f"></span></div>
        <span style="font-size:12px;color:#8b949e">${esc(cr.name)}</span>
      </div>
      <button class="btn btn-success btn-xs" onclick="runCode()">▶ Run</button>
    </div>
    <div class="code-body" contenteditable="true" id="codeEditorBody" spellcheck="false">${formatCode(cr.code)}</div>
    <div style="background:#0d1117;border-top:1px solid #30363d;padding:10px 16px;font-size:12px;color:#8b949e;font-family:var(--mono)" id="codeOutput">Output will appear here...</div>
  </div>`;
}
function formatCode(code){
  return code.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\b(class|def|return|import|from|if|else|elif|for|while|in|not|and|or|True|False|None|print|self)\b/g,'<span class="kw">$1</span>')
    .replace(/(&lt;[^&]+&gt;|"[^"]*"|'[^']*'|`[^`]*`)/g,'<span class="str">$1</span>')
    .replace(/\b(\d+\.?\d*)\b/g,'<span class="num">$1</span>')
    .replace(/(#[^\n]*)/g,'<span class="cm">$1</span>');
}
function runCode(){
  const code=document.getElementById('codeEditorBody').innerText;
  document.getElementById('codeOutput').innerHTML=`<span style="color:#27c93f">▶ [KITI Python Runtime]</span>\n<span style="color:#c9d1d9">Simulation: Code parsed successfully. ${code.includes('print')?'Output: Student("Alice Kamau", "D012/ICT/2024") → Average: 81.5%':''}</span>`;
}
function sendChatMsg(){
  const inp=document.getElementById('chatInputEl');
  const text=inp.value.trim(); if(!text) return;
  const now=new Date();
  const time=`${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  if(!chatRooms[activeRoom]) chatRooms[activeRoom]=[];
  chatRooms[activeRoom].push({user:'Me',own:true,text,time});
  inp.value='';
  document.getElementById('chatContainer').innerHTML=buildChat();
  const msgs=document.getElementById('chatMsgs');
  if(msgs) msgs.scrollTop=msgs.scrollHeight;
}
function openChatRoom(rid){
  const r=db.rooms.find(x=>x.id===rid);
  if(!r) return;
  activeRoom=rid==='R1'?'general':rid==='R2'?'cybersec':'data-analysis';
  document.getElementById('chatContainer').innerHTML=buildChat();
}

function buildNoteList(filter){
  const notes=db.notes.filter(n=>!filter||n.studentId===filter).sort((a,b)=>new Date(b.date)-new Date(a.date));
  if(!notes.length) return`<div class="empty"><div class="empty-icon">💬</div><p>No notes yet</p></div>`;
  const typeIcon={note:'📝',feedback:'💬',commendation:'⭐',warning:'⚠️',instruction:'📋'};
  return notes.map(n=>{const s=db.students.find(x=>x.id===n.studentId);return`<div style="padding:14px;background:var(--bg3);border-radius:10px;margin-bottom:10px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <div style="display:flex;align-items:center;gap:8px"><div class="av av-sm" style="${avStyle(s?s.name:'A')}">${s?initials(s.name):'?'}</div><div><div style="font-size:13px;font-weight:600">${s?esc(s.name):''}</div><div style="font-size:11px;color:var(--muted)">${fmtDate(n.date)} · ${esc(n.author)}</div></div></div>
      <div style="display:flex;align-items:center;gap:6px"><span style="font-size:14px">${typeIcon[n.type||'note']||'📝'}</span><button onclick="deleteNote('${n.id}')" style="background:none;border:none;cursor:pointer;color:var(--muted);font-size:14px">✕</button></div>
    </div>
    <div style="font-size:13px;line-height:1.6">${esc(n.content)}</div>
  </div>`}).join('');
}
function filterNotes(){const f=document.getElementById('nt_filter').value;document.getElementById('noteList').innerHTML=buildNoteList(f);}
function postNote(){
  const content=document.getElementById('nt_content').value.trim();if(!content){alert('Message is required');return;}
  db.notes.push({id:'N'+uid(),studentId:document.getElementById('nt_student').value,type:document.getElementById('nt_type').value,content,author:'Mr. Omondi',date:new Date().toISOString().slice(0,10)});
  document.getElementById('nt_content').value='';save();document.getElementById('noteList').innerHTML=buildNoteList('');
}
function deleteNote(id){db.notes=db.notes.filter(x=>x.id!==id);save();const el=document.getElementById('noteList');if(el)el.innerHTML=buildNoteList('');}

function saveGradeEntry(sid,aid,max){
  const score=parseInt(document.getElementById('gs_'+sid).value);
  const feedback=document.getElementById('gf_'+sid).value;
  if(isNaN(score))return;
  const id=sid+'_'+aid;const existing=db.grades.find(x=>x.studentId===sid&&x.assignmentId===aid);
  if(existing){existing.score=score;existing.feedback=feedback;}
  else db.grades.push({studentId:sid,assignmentId:aid,score,feedback,submitted:true});
  const a=db.assignments.find(x=>x.id===aid);if(a)a.submissions=db.grades.filter(g=>g.assignmentId===aid).length;
  save();alert(`Saved grade for student`);
}

  save();closeModal();alert('Note posted successfully!');
}
function openActivityModal(sid){
  const s=db.students.find(x=>x.id===sid);if(!s)return;
  const grades=db.grades.filter(g=>g.studentId===sid);
  const att=db.attendance.filter(a=>a.studentId===sid);
  const notes=db.notes.filter(n=>n.studentId===sid);
  showModal(`<div class="modal-header"><span class="modal-title">Activity: ${esc(s.name)}</span><button class="modal-close" onclick="closeModal()">✕</button></div>
  <div class="modal-body">
    <div class="g3" style="margin-bottom:20px">
      <div class="stat-card" style="padding:14px"><div class="stat-val" style="font-size:24px;color:var(--accent)">${s.gpa}%</div><div class="stat-label">Avg Grade</div></div>
      <div class="stat-card" style="padding:14px"><div class="stat-val" style="font-size:24px;color:${s.attendance>=80?'var(--green)':'var(--red)'}">${s.attendance}%</div><div class="stat-label">Attendance</div></div>
      <div class="stat-card" style="padding:14px"><div class="stat-val" style="font-size:24px">${grades.length}</div><div class="stat-label">Submitted</div></div>
    </div>
    <div style="font-weight:700;font-size:13px;margin-bottom:10px">Assignment Grades</div>
    ${grades.map(g=>{const a=db.assignments.find(x=>x.id===g.assignmentId);const pct=Math.round(g.score/(a?a.maxMarks:100)*100);return`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px"><span>${a?esc(a.title):'?'}</span><span style="font-weight:700;color:${pct>=80?'var(--green)':pct>=50?'var(--accent)':'var(--red)'}">${g.score}/${a?a.maxMarks:100}</span></div>`}).join('') || '<div style="color:var(--muted);font-size:13px">No grades yet.</div>'}
    <div style="font-weight:700;font-size:13px;margin:16px 0 10px">Attendance</div>
    <div style="display:flex;gap:6px;flex-wrap:wrap">
      ${att.map(a=>`<div style="text-align:center"><div style="width:10px;height:10px;border-radius:50%;background:${a.status==='present'?'var(--green)':a.status==='late'?'var(--accent3)':'var(--red)'};margin:0 auto 2px"></div><div style="font-size:9px;color:var(--muted)">${a.date.slice(5)}</div></div>`).join('')}
    </div>
    <div style="font-weight:700;font-size:13px;margin:16px 0 10px">Notes (${notes.length})</div>
    ${notes.map(n=>`<div style="background:var(--bg3);border-radius:8px;padding:10px;margin-bottom:8px"><div style="font-size:11px;color:var(--muted);margin-bottom:4px">${fmtDate(n.date)}</div><div style="font-size:13px">${esc(n.content)}</div></div>`).join('') || '<div style="color:var(--muted);font-size:13px">No notes.</div>'}
    <button class="btn btn-outline" style="width:100%;margin-top:14px" onclick="closeModal();openNoteModal('${sid}')">+ Add Note</button>
  </div>`,'lg');
}
function openAddStudentModal(){
  showModal(`<div class="modal-header"><span class="modal-title">Add Student</span><button class="modal-close" onclick="closeModal()">✕</button></div>
  <div class="modal-body">
    <div class="form-group"><label class="form-label">Full Name</label><input class="form-control" id="ns_name" placeholder="e.g. Grace Njeri"></div>
    <div class="form-row"><div class="form-group"><label class="form-label">Reg No.</label><input class="form-control" id="ns_reg" placeholder="D0XX/ICT/2025"></div><div class="form-group"><label class="form-label">Year</label><select class="form-control" id="ns_year"><option>1</option><option>2</option><option>3</option></select></div></div>
    <div class="form-group"><label class="form-label">Email</label><input class="form-control" id="ns_email" placeholder="student@kiti.ac.ke"></div>
    <div class="form-group"><label class="form-label">Phone</label><input class="form-control" id="ns_phone"></div>
    <button class="btn btn-accent" style="width:100%" onclick="saveStudent()">Add Student</button>
  </div>`);
}
function saveStudent(){
  const name=document.getElementById('ns_name').value.trim();if(!name){alert('Name required');return;}
  db.students.push({id:'S'+uid(),name,regNo:document.getElementById('ns_reg').value,year:parseInt(document.getElementById('ns_year').value),email:document.getElementById('ns_email').value,phone:document.getElementById('ns_phone').value,course:'Diploma ICT',gpa:0,attendance:0,colorIdx:db.students.length%6});
  save();closeModal();renderStudents();
}
function deleteStudent(id){if(!confirm('Delete student?'))return;db.students=db.students.filter(x=>x.id!==id);save();renderStudents();}
function openAddAnnouncementModal(){
  showModal(`<div class="modal-header"><span class="modal-title">Post Announcement</span><button class="modal-close" onclick="closeModal()">✕</button></div>
  <div class="modal-body">
    <div class="form-group"><label class="form-label">Title</label><input class="form-control" id="an_title"></div>
    <div class="form-group"><label class="form-label">Type</label><select class="form-control" id="an_type"><option value="course">Course Update</option><option value="exam">Exam Notice</option><option value="admin">Administrative</option></select></div>
    <div class="form-group"><label class="form-label">Message</label><textarea class="form-control" id="an_body" rows="5"></textarea></div>
    <button class="btn btn-accent" style="width:100%" onclick="saveAnnouncement()">Post Announcement</button>
  </div>`);
}
function saveAnnouncement(){
  const t=document.getElementById('an_title').value.trim();if(!t){alert('Title required');return;}
  db.announcements.unshift({id:'AN'+uid(),title:t,body:document.getElementById('an_body').value,type:document.getElementById('an_type').value,author:'Mr. Omondi',date:new Date().toISOString().slice(0,10)});
  save();closeModal();renderLecturerDashboard();
}
function openAddCATModal(){
  showModal(`<div class="modal-header"><span class="modal-title">Create CAT</span><button class="modal-close" onclick="closeModal()">✕</button></div>
  <div class="modal-body">
    <div class="form-group"><label class="form-label">CAT Title</label><input class="form-control" id="cat_title" placeholder="e.g. Programming Fundamentals CAT"></div>
    <div class="form-row"><div class="form-group"><label class="form-label">Subject</label><select class="form-control" id="cat_sub"><option>Programming</option><option>Networking</option><option>Cybersecurity</option><option>Database Management</option><option>Web Development</option></select></div><div class="form-group"><label class="form-label">Duration (mins)</label><input type="number" class="form-control" id="cat_dur" value="30"></div></div>
    <div class="form-group"><label class="form-label">Date</label><input type="date" class="form-control" id="cat_date"></div>
    <div class="sep">Questions</div>
    <div id="catQBuilder"><div style="color:var(--muted);font-size:13px">Questions added: 0</div></div>
    <button class="btn btn-outline btn-sm" style="width:100%;margin-bottom:12px" onclick="addCATQuestion()">➕ Add Question</button>
    <button class="btn btn-accent" style="width:100%" onclick="saveCAT()">Create CAT</button>
  </div>`,'lg');
  catQuestions=[];
}
let tempCATQs=[];
function addCATQuestion(){
  showModal(`<div class="modal-header"><span class="modal-title">Add Question</span><button class="modal-close" onclick="closeModal()">✕</button></div>
  <div class="modal-body">
    <div class="form-group"><label class="form-label">Question</label><textarea class="form-control" id="qst_q" rows="3"></textarea></div>
    ${[0,1,2,3].map(i=>`<div class="form-group"><label class="form-label">Option ${i+1}</label><input class="form-control" id="qst_opt${i}" placeholder="Option ${i+1}"></div>`).join('')}
    <div class="form-group"><label class="form-label">Correct Answer</label><select class="form-control" id="qst_ans"><option value="0">Option 1</option><option value="1">Option 2</option><option value="2">Option 3</option><option value="3">Option 4</option></select></div>
    <button class="btn btn-accent" style="width:100%" onclick="confirmAddQ()">Add Question</button>
  </div>`);
}
function confirmAddQ(){
  const q=document.getElementById('qst_q').value.trim();if(!q)return;
  tempCATQs.push({q,opts:[0,1,2,3].map(i=>document.getElementById('qst_opt'+i).value||`Option ${i+1}`),ans:parseInt(document.getElementById('qst_ans').value)});
  closeModal();openAddCATModal();
  setTimeout(()=>{document.getElementById('catQBuilder').innerHTML=`<div style="color:var(--accent);font-size:13px;font-weight:600">✓ ${tempCATQs.length} question(s) added</div>`;},50);
}
function saveCAT(){
  const t=document.getElementById('cat_title').value.trim();if(!t){alert('Title required');return;}
  db.catList.push({id:'CAT'+uid(),title:t,subject:document.getElementById('cat_sub').value,duration:parseInt(document.getElementById('cat_dur').value)||30,date:document.getElementById('cat_date').value,status:'upcoming',questions:tempCATQs.length?tempCATQs:[{q:'Sample Q?',opts:['A','B','C','D'],ans:0}]});
  tempCATQs=[];save();closeModal();renderLecturerCAT();
}
function toggleCATStatus(id){const c=db.catList.find(x=>x.id===id);if(c){c.status=c.status==='upcoming'?'live':c.status==='live'?'completed':'upcoming';}save();renderLecturerCAT();}
function deleteCAT(id){if(!confirm('Delete?'))return;db.catList=db.catList.filter(x=>x.id!==id);save();renderLecturerCAT();}
function openEditCATModal(id){const c=db.catList.find(x=>x.id===id);if(!c)return;alert(`Editing: ${c.title}\n${c.questions.length} questions, ${c.duration} min\n\nFull edit UI coming soon!`);}
function openModuleModal(id){const m=db.modules.find(x=>x.id===id);if(!m)return;
  showModal(`<div class="modal-header"><span class="modal-title">${m.icon} ${esc(m.title)}</span><button class="modal-close" onclick="closeModal()">✕</button></div>
  <div class="modal-body">
    <div style="font-size:13px;color:var(--muted);margin-bottom:14px;line-height:1.7">${esc(m.desc)}</div>
    <div class="form-group" style="margin-bottom:16px"><label class="form-label">Your Progress</label><div style="display:flex;align-items:center;gap:10px"><div class="progress" style="flex:1"><div class="progress-bar" style="width:${m.progress}%;background:var(--accent)"></div></div><span style="font-weight:700;color:var(--accent)">${m.progress}%</span></div></div>
    <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px">${m.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>
    <div style="background:var(--bg3);border-radius:10px;padding:16px;margin-bottom:16px"><div style="font-weight:700;font-size:13px;margin-bottom:10px">📋 Module Outline</div>
    ${Array.from({length:Math.min(m.lessons,6)},(_,i)=>`<div style="padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;display:flex;align-items:center;gap:10px"><span style="color:${i<m.lessons*m.progress/100?'var(--green)':'var(--muted)'}">${i<m.lessons*m.progress/100?'✓':'○'}</span> Lesson ${i+1}: ${['Introduction','Core Concepts','Practical Work','Lab Exercise','Case Study','Assessment'][i]}</div>`).join('')}
    </div>
    <div style="display:flex;gap:10px">
      <button class="btn btn-accent" style="flex:1" onclick="closeModal()">▶ Continue Learning</button>
      <button class="btn btn-outline" onclick="closeModal()">📥 Download Notes</button>
    </div>
  </div>`,'lg');
}
function openCreateRoomModal(){
  showModal(`<div class="modal-header"><span class="modal-title">Create Room</span><button class="modal-close" onclick="closeModal()">✕</button></div>
  <div class="modal-body">
    <div class="form-group"><label class="form-label">Room Name</label><input class="form-control" id="rm_name" placeholder="e.g. Final Year Study Group"></div>
    <div class="form-group"><label class="form-label">Type</label><select class="form-control" id="rm_type"><option value="study">Study Group</option><option value="class">Class Room</option><option value="codespace">CodeSpace</option></select></div>
    <div class="form-group"><label class="form-label">Icon</label><select class="form-control" id="rm_icon"><option value="💬">💬 Chat</option><option value="🐍">🐍 Python</option><option value="📊">📊 Data</option><option value="🔐">🔐 Security</option><option value="🌐">🌐 Web</option></select></div>
    <button class="btn btn-accent" style="width:100%" onclick="saveRoom()">Create Room</button>
  </div>`);
}
function saveRoom(){
  const name=document.getElementById('rm_name').value.trim();if(!name){alert('Name required');return;}
  db.rooms.push({id:'R'+uid(),name,type:document.getElementById('rm_type').value,icon:document.getElementById('rm_icon').value,members:role==='student'?['Alice Kamau']:['Mr. Omondi']});
  save();closeModal();renderCollaborate();
}
function openNotifModal(){
  showModal(`<div class="modal-header"><span class="modal-title">🔔 Notifications</span><button class="modal-close" onclick="closeModal()">✕</button></div>
  <div class="modal-body">
    ${[
      {text:'Assignment "Network Topology Design" is due in 3 days',time:'2 hours ago',dot:true},
      {text:'Mr. Omondi posted a note for you: "Excellent performance..."',time:'1 day ago',dot:true},
      {text:'Programming Fundamentals CAT scheduled for 15 July',time:'2 days ago',dot:false},
      {text:'New module available: Cloud Computing',time:'3 days ago',dot:false},
      {text:'Data Structures class: Monday 09:00 – Join link sent',time:'3 days ago',dot:false},
    ].map(n=>`<div class="notif-item"><div class="notif-dot2" style="background:${n.dot?'var(--accent)':'var(--border)'}"></div><div class="notif-body">${esc(n.text)}<div class="notif-time">${n.time}</div></div></div>`).join('')}
  </div>`);
}
</script>
